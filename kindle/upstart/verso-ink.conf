# Verso Ink: abre o sistema próprio quando a interface da Amazon termina de subir.
# Saídas de emergência (tratadas no ctl.sh e no portão do binário):
#   - arquivo /mnt/us/verso-ink/DISABLE  → não abre
#   - 3 boots seguidos sem chegar a 20 s estáveis → não abre
#   - segurar o canto superior esquerdo durante "Abrindo…" → não abre desta vez
# Para remover: /mnt/us/verso-ink/bin/ctl.sh boot-off (ou apagar este arquivo com mntroot rw).

description "Verso Ink"

start on started lab126_gui

task

script
    [ -x /mnt/us/verso-ink/bin/ctl.sh ] || exit 0
    exec /bin/sh /mnt/us/verso-ink/bin/ctl.sh boot
end script
