[package]
name = "verso-ink"
version = "0.4.0"
edition = "2021"
# 1.97: a biblioteca de RAR (quadrinhos CBR) pede essa versão (rust-toolchain.toml).
rust-version = "1.97"

[profile.release]
# Velocidade, não tamanho: no Kindle, 4 a 10% mais rápido que "s" (binário 0,7 MB maior).
opt-level = 3
lto = true
strip = true
panic = "abort"

[dependencies]
fontdue = "0.9.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# PDF desenhado no próprio Verso Ink, em Rust puro (sem as tabelas CJK, para o binário ficar menor).
hayro = { version = "0.9.0", default-features = false, features = ["embed-fonts"] }
# Quadrinhos CBR (RAR), só leitura, em Rust puro. Licença: Apache 2.0 + a cláusula do UnRAR
# (docs/licencas/unrar-rs.txt, que vai junto do binário).
unrar-rs = { version = "0.16.1", default-features = false, features = ["crypto-rust"] }
unicode-normalization = "0.1.26"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
