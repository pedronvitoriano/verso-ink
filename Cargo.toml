[package]
name = "verso-ink"
version = "0.4.0"
edition = "2021"

[profile.release]
# Velocidade, não tamanho: no Kindle, 4 a 10% mais rápido que "s" (binário 0,7 MB maior).
opt-level = 3
lto = true
strip = true
panic = "abort"

[dependencies]
fontdue = "0.9.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif"] }
unicode-normalization = "0.1.26"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
